<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Readings - Índice</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .index-wrapper {
      max-width: 800px;
      margin: 80px auto;
      padding: 30px;
      background: linear-gradient(180deg, rgba(16,24,39,0.96), rgba(9,14,24,0.98));
      border: 1px solid rgba(100, 120, 160, 0.28);
      border-radius: 14px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.35);
    }
    .index-wrapper h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .index-wrapper p {
      color: var(--muted);
      margin-bottom: 24px;
      font-size: 13px;
    }
    .links-list {
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .links-list a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: #121a2b;
      border: 1px solid rgba(110, 130, 170, 0.24);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      transition: all 0.2s ease;
    }
    .links-list a:hover {
      border-color: var(--green);
      background: #18243c;
      transform: translateX(4px);
    }
    .badge-file {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(44, 255, 135, 0.12);
      color: var(--green);
      border: 1px solid rgba(44, 255, 135, 0.35);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="index-wrapper">
      <h1>Readings Index</h1>
      <p>Directorio de archivos y cronologías de investigación guardadas:</p>
      
      <ul class="links-list">
        <li>
          <a href="boceto_timeline_oscar_gonzalez.html">
            <span>📂 Timeline Caso Oscar González (Boceto Completo)</span>
            <span class="badge-file">HTML</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</body>
</html>
